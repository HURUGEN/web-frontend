server {
    # Listens on the internal HTTP port forwarded by the Kubernetes ClusterIP Service.
    listen 80;
    server_name _;

    # Points Nginx at Dockerfile-generated static content and the mounted config.js file.
    root /usr/share/nginx/html;
    index index.html;

    # Serves public runtime configuration without caching so an updated ConfigMap is observed on refresh.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /config.js =404;
    }

    # Caches fingerprinted Vite assets while keeping HTML and config.js outside this long-lived policy.
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Falls back to index.html so browser-side SPA routes remain directly reachable.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
